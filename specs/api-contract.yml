openapi: 3.1.0
info:
  title: Lô Tô Online API
  version: 0.1.0
  summary: Các thao tác ghi (write path) của Lô Tô Online — Next.js Server Actions trên Firebase App Hosting.
  description: |
    Nguồn: `specs/ui-ux/wireframe.md` mục 4 (bảng thao tác), `idea/business.md` (BR, ma trận Actor × BIZ),
    `idea/business-flows.md` (FLOW, SUP, NFR), `specs/database.md` (TBL-01..TBL-08), `specs/tech-stack.md`
    (ADR-03, ADR-05, ADR-06, ADR-07, ADR-09, ADR-12, ADR-14), `idea/_qa-log.md` (Q-045..Q-052 ghi đè quyết định cũ).
    Cập nhật: 2026-11-18.

    ## Phạm vi
    - Theo ADR-03: **mọi thao tác ghi** đi qua các operation trong file này. Client **chỉ đọc** Firestore bằng
      realtime listener (`users/{uid}`, `rooms/{roomId}` gồm `called_numbers`, `invite_code`, `last_event`;
      `tickets`, `games`, `games/*/players`, `messages`) và tự ghi node presence của mình trên RTDB (ADR-06),
      tự tải ảnh lên `avatars/{uid}/…` trên Storage (ADR-12). Các thao tác đó ghi `— (realtime)` / `— (client)` ở
      cột operationId của wireframe, **không có operation**.
    - Ngoại lệ đọc qua server: `getInvite` (trang `/join/{code}` render ở server, công khai, có Open Graph – ADR-09).
    - **Không có endpoint danh sách** (tin nhắn, lịch sử ván, người trong phòng đều đọc bằng listener) nên không có
      phân trang. Nếu sau này cần, quy ước là cursor: query `cursor` (opaque) + `limit` (1–100, mặc định 50),
      response `{items, nextCursor}`. (Q-050)
    - **Không có hẹn giờ phía server (Q-051, ADR-05):** mọi việc theo thời gian do client gọi API khi tới giờ —
      rao số (`drawNumber`, host + player dự phòng), hết hạn phòng
      (`expireRoom`). Server luôn kiểm thời điểm bằng giờ server nên client không làm nhanh/chậm được, và mọi
      thao tác trên phòng đều tự áp dụng hết hạn trước (lazy expiry, BR-04). Việc nền duy nhất còn lại là thống kê
      ngày (`x-background-tasks`).

    ## Transport (ADR-03)
    - Mỗi operation được hiện thực bằng **Server Action** `<operationId>Action(input)` trả
      `ActionResult<T>` = `{ok: true, data: <response 2xx>}` | `{ok: false, error: Error}`.
      `input` = gộp path params + body (vd `startGameAction({roomId, gameId})`). Response `204` ↔ `data: null`.
    - Path/method/status trong file này là dạng REST tương đương, dùng khi cần expose thành Route Handler `/api/*`
      và để thống nhất ngữ nghĩa mã lỗi (HTTP status ↔ `error.code`).
    - Mỗi action: xác thực phiên → validate Zod (schema ở đây) → kiểm BR trong **Firestore transaction**
      bằng `firebase-admin` → ghi `rooms.last_event` (SUP-01) khi có sự kiện phòng.

    ## Xác thực (ADR-07)
    - Client đăng nhập Firebase Auth (Google: redirect trên điện thoại, popup trên máy tính), gọi `createSession`
      với Firebase ID token để nhận session cookie `__session` (httpOnly, secure, sameSite=lax, 14 ngày).
    - Mọi operation khác dùng cookie `__session`; server `verifySessionCookie(cookie, checkRevoked = true)`.
    - Quyền trong phòng (NFR-09):
      - **Thành viên phòng** = `users.current_room_id == roomId` (Q-047). Không phải → `403 NOT_ROOM_MEMBER`.
      - **Host** = `rooms.host_uid == uid`, cố định suốt đời phòng (BR-21, Q-048). Không phải → `403 NOT_ROOM_HOST`.
      - **Player của ván** = có doc `rooms/{roomId}/games/{current}/players/{uid}` (tạo khi lấy vé – Q-047).

    ## Quy ước
    - JSON `camelCase` (DB `snake_case`). Thời gian ISO-8601 UTC (`date-time`); client hiển thị GMT+7 (NFR-16).
    - Không lộ: `users.email` của người khác (NFR-10), `chat_recent_at`, `expire_at`,
      `blocked_uids`, `profile_customized` của người khác.
    - `400 VALIDATION_FAILED` = sai cấu trúc / kiểu (Zod). `422` = vi phạm quy tắc nghiệp vụ về dữ liệu.
      `409` = xung đột trạng thái (ván/phòng/vé). Mọi lỗi dùng schema `Error`.
    - Thao tác trên ván nhận `gameId` trong path; nếu khác `rooms.current_game_id` → `409 GAME_STALE`
      (client đang xem trạng thái cũ).
    - Mỗi operation có `x-business`, `x-screens`, `x-roles`; khi có: `x-supporting`, `x-nfr`, `x-errors`,
      `x-last-event` (giá trị `rooms.last_event.type` được ghi).

    ## Bảng mã lỗi nghiệp vụ
    | code | HTTP | Ý nghĩa | Ref |
    |---|---|---|---|
    | VALIDATION_FAILED | 400 | Request sai cấu trúc / kiểu | — |
    | GOOGLE_TOKEN_INVALID | 401 | ID token Google/Firebase sai hoặc hết hạn khi tạo phiên | BR-01, ADR-07 |
    | UNAUTHENTICATED | 401 | Thiếu / sai / bị thu hồi session cookie | SUP-05, ADR-07 |
    | NOT_ROOM_MEMBER | 403 | Không (còn) ở phòng này: đã rời, bị kick, phòng đã đóng | BR-02, Q-047, Q-039 |
    | NOT_ROOM_HOST | 403 | "Chỉ host được thực hiện thao tác này" | BR-21, NFR-09 |
    | BLOCKED_FROM_ROOM | 403 | "Bạn không thể vào phòng này" (đã bị kick) | BR-06 |
    | NOT_TICKET_HOLDER | 403 | Bấm Kinh cho vé không thuộc mình / không tham gia ván | BIZ-08 E1, BR-22 |
    | INVITE_INVALID | 404 | Mã mời không tồn tại | BR-05, NFR-09 |
    | TICKET_NOT_FOUND | 404 | `ticketId` không thuộc bộ vé | BR-08 |
    | PLAYER_NOT_FOUND | 404 | Người đích không phải player của ván hiện tại hoặc không còn trong phòng | BIZ-10 (Q-048), BR-13 |
    | ALREADY_IN_ROOM | 409 | Đang ở phòng khác; `details[0].currentRoomId` để nút "Về phòng hiện tại" | BR-02 |
    | INVITE_EXPIRED | 410 | "Link không còn hiệu lực" — quá hạn hoặc phòng đã đóng / chờ đóng | BR-05, BR-04 |
    | ROOM_FULL | 409 | "Phòng đã đầy" (16 người) | BR-03 |
    | ~~HOST_CANNOT_LEAVE~~ | — | (đã loại – Q-057: host rời = đóng phòng) | — |
    | ~~GAME_IN_PROGRESS~~ | — | (đã loại – Q-057: rời/đăng xuất giữa ván được, client cảnh báo) | — |
    | ROOM_CODE_INVALID | 404 | "Mã phòng không đúng hoặc đã hết hạn" — không có phòng mở với `join_code` này | BR-30, Q-056 |
    | DRAW_TOO_EARLY | 409 | Chưa tới `next_call_at` (trả kèm `nextCallAt` để client đồng bộ lại) | BR-15, Q-051 |
    | ~~CLAIM_WINDOW_OPEN~~ | — | (đã loại – Q-055) | — |
    | ROOM_NOT_EXPIRED | 409 | Phòng chưa tới `expires_at` | BR-04, Q-051 |
    | ROOM_CLOSING | 409 | Phòng đã đến hạn (chờ đóng) — không bắt đầu ván mới | BR-04, BR-14 |
    | GAME_STALE | 409 | `gameId` không phải ván hiện tại | BR-07 |
    | GAME_NOT_WAITING | 409 | Ván không ở Chờ bắt đầu (lấy/bỏ vé, tạo bộ vé, thu hồi, bắt đầu) | BR-10, BR-12, BR-13 |
    | GAME_NOT_RUNNING | 409 | Tạm dừng khi ván không Đang quay | BIZ-06 |
    | GAME_NOT_PAUSED | 409 | Tiếp tục khi ván không Tạm dừng | BIZ-06 |
    | GAME_NOT_AWAITING_CONFIRM | 409 | Xác nhận / bác bỏ khi ván không ở Chờ host duyệt | BR-28 |
    | CLAIMS_CLOSED | 409 | Ván không nhận Kinh (chờ bắt đầu, đã kết thúc, đã hủy) | BR-28, BIZ-08 |
    | TICKET_ALREADY_CLAIMED | 409 | Vé này đã có lượt Kinh đang chờ duyệt | BR-28, Q-055 |
    | CLAIM_HAS_WIN | 409 | Bác bỏ khi có vé được hệ thống gợi ý đúng | BR-28, Q-055 |
    | NO_WINNING_CLAIM | 409 | Xác nhận kết thúc khi không có vé đúng | BR-28, Q-055 |
    | TICKET_TAKEN | 409 | "Vé đã có người giữ" | BR-09 |
    | TICKET_NOT_HELD | 409 | Bỏ vé mình không giữ | BR-09 |
    | TICKETS_STILL_HELD | 409 | Còn người giữ vé — không tạo được bộ vé mới; `details[]` liệt kê người giữ + online | BR-12 |
    | TARGET_ONLINE | 409 | Thu hồi vé người đang online | BR-13 |
    | NO_TICKETS_HELD | 422 | Chưa đủ 2 người giữ vé — không bắt đầu được | BR-14, Q-059 |
    | TICKET_LIMIT_REACHED | 422 | Đã giữ 2 vé | BR-09 |
    | CANNOT_TARGET_SELF | 422 | Host tự kick / tự thu hồi vé của mình | BIZ-10 E1 |
    | ROOM_NAME_INVALID | 422 | Tên phòng rỗng sau trim hoặc > 50 ký tự | ENT-02 |
    | DRAW_INTERVAL_INVALID | 422 | Nhịp quay không phải 5, 10 hoặc 15 giây | BR-15 |
    | DISPLAY_NAME_INVALID | 422 | Tên hiển thị ngoài 2–30 ký tự | BR-27 |
    | AVATAR_INVALID | 422 | Ảnh không thuộc `avatars/{uid}/`, không tồn tại, sai định dạng / > 5 MB, hoặc avatar có sẵn không tồn tại | BR-27, ADR-12 |
    | MESSAGE_EMPTY | 422 | Tin rỗng sau trim | BR-23 |
    | MESSAGE_TOO_LONG | 422 | Tin > 500 ký tự | BR-23 |
    | RATE_LIMITED | 429 | "Bạn gửi quá nhanh" — > 5 tin / 10 giây | BR-23, SUP-07 |
    | INTERNAL_ERROR | 500 | Lỗi hệ thống | NFR-17 |
  contact:
    name: Lô Tô Online team
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  x-background-tasks:
    description: |
      Việc nền duy nhất (Cloud Scheduler, ADR-11). Mọi hẹn giờ theo phòng/ván đã chuyển xuống client (Q-051, ADR-05):
      `gameTick` → `drawNumber`; `claimWindowClose` → (đã loại – Q-055); `roomExpiryWarn` → client tự hiện cảnh báo
      từ `rooms.expires_at`; `roomClose` → `expireRoom` + lazy expiry.
    tasks:
      - name: aggregateDailyStats
        kind: schedule
        schedule: '10 0 * * * (Asia/Ho_Chi_Minh)'
        effect: Ghi `stats/{yyyy-mm-dd}` của ngày trước bằng aggregation query (ADR-11).
        x-supporting: [SUP-09]
        x-nfr: [NFR-17]
servers:
  - url: https://{host}/api
    description: Firebase App Hosting (domain thật chốt khi deploy) (Q-050)
    variables:
      host:
        default: loto.example.com
  - url: http://localhost:3000/api
    description: Local (Next.js dev + Firebase Emulator Suite)
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: Phiên đăng nhập Google (BIZ-01, SUP-05)
  - name: Profile
    description: Hồ sơ của tôi (BIZ-16, SUP-08)
  - name: Rooms
    description: Tạo phòng, nhịp quay (BIZ-02, BIZ-06)
  - name: Invites
    description: Link mời & vào phòng (BIZ-03, SUP-06)
  - name: Members
    description: Rời phòng, kick, thu hồi vé (BIZ-04, BIZ-10, BIZ-11)
  - name: Tickets
    description: Lấy / bỏ vé, tạo lại bộ vé (BIZ-04, BIZ-05)
  - name: Games
    description: Điều khiển ván, báo Kinh, xác nhận kết thúc (BIZ-06, BIZ-08)
  - name: Messages
    description: Chat trong phòng (BIZ-12, SUP-07)

paths:
  # ───────────────────────────── Auth ─────────────────────────────
  /sessions:
    post:
      tags: [Auth]
      operationId: createSession
      summary: Đăng nhập với Google, tạo phiên
      description: |
        Client đã đăng nhập Firebase Auth bằng Google và gửi ID token. Server `verifyIdToken`, tạo session cookie
        `__session` (14 ngày, `Set-Cookie`) và:
        - Lần đầu: tạo `users/{uid}` với `email`, `google_name`, `google_photo_url`, `display_name = google_name`,
          `photo_url = google_photo_url`, `profile_customized = false`.
        - Đã có: cập nhật `google_name`, `google_photo_url`, `last_active_at`; nếu `profile_customized = false`
          thì đồng bộ `display_name`, `photo_url` theo Google (FLOW-01 A3).
        Trả `currentRoomId` để client điều hướng: có `returnTo` (link mời, client tự giữ) → SCR-03; đang ở phòng →
        SCR-04; còn lại → SCR-02. Nhận diện trình duyệt in-app (SCR-01.A2) làm ở client, không thuộc API.
      x-business: [BIZ-01]
      x-screens: [SCR-01.A1]
      x-roles: [ACT-01, ACT-04]
      x-supporting: [SUP-05, SUP-09]
      x-nfr: [NFR-13]
      x-errors: [VALIDATION_FAILED, GOOGLE_TOKEN_INVALID]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
            example:
              idToken: eyJhbGciOiJSUzI1NiIsImtpZCI6Ij...
      responses:
        '200':
          description: 'Đã tạo phiên. Header `Set-Cookie: __session=…; HttpOnly; Secure; SameSite=Lax; Max-Age=1209600`.'
          headers:
            Set-Cookie:
              description: Session cookie `__session`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResult'
              examples:
                inRoom:
                  summary: Đang ở một phòng → vào thẳng SCR-04
                  value:
                    me:
                      uid: u_7Hq2Lx
                      email: an.nguyen@gmail.com
                      displayName: An Nguyễn
                      photoUrl: https://lh3.googleusercontent.com/a/abc
                      googleName: An Nguyễn
                      googlePhotoUrl: https://lh3.googleusercontent.com/a/abc
                      profileCustomized: false
                      currentRoomId: r_9fK2mQ
                    isNewUser: false
                firstTime:
                  summary: Lần đầu đăng nhập
                  value:
                    me:
                      uid: u_2Mn8Rt
                      email: binh.tran@gmail.com
                      displayName: Bình Trần
                      photoUrl: https://lh3.googleusercontent.com/a/xyz
                      googleName: Bình Trần
                      googlePhotoUrl: https://lh3.googleusercontent.com/a/xyz
                      profileCustomized: false
                      currentRoomId: null
                    isNewUser: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /sessions/current:
    delete:
      tags: [Auth]
      operationId: deleteCurrentSession
      summary: Đăng xuất
      description: |
        Đăng xuất = **thoát phòng** (Q-051, Q-052, Q-057). Ván đang diễn ra (`running`/`paused`/`awaiting_confirm`)
        **không** chặn: client hiện dialog cảnh báo "đang chơi, vé sẽ bị hủy" trước khi gọi.
        - **Player** (không phải host) → trong cùng transaction làm đúng như `leaveRoom`.
        - **Host** → **đóng phòng cho mọi người** như `leaveRoom` của host: ván hiện tại chưa kết thúc → `cancelled`
          (`result = cancelled`, không ai thắng), phòng `closed`,
          `close_reason = host_left`, `last_event = room_closed`, `users.current_room_id = null` cho mọi người trong phòng,
          xóa RTDB presence của phòng (BR-21, Q-052).
        - Không ở phòng nào → chỉ hủy phiên.
        - Sau đó xóa cookie `__session` và `revokeRefreshTokens(uid)`. Client gọi thêm `signOut()` của Firebase Auth.
      x-business: [BIZ-01]
      x-screens: [SCR-02.A3, SCR-10.A4]
      x-roles: [ACT-01, ACT-02, ACT-03]
      x-supporting: [SUP-05, SUP-01]
      x-errors: [UNAUTHENTICATED]
      x-last-event: [member_left, room_closed]
      responses:
        '204':
          description: Đã kết thúc phiên (và đã rời phòng nếu đang ở phòng)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ───────────────────────────── Profile ─────────────────────────────
  /me/profile:
    patch:
      tags: [Profile]
      operationId: updateProfile
      summary: Cập nhật tên hiển thị / ảnh đại diện
      description: |
        Ghi `users.display_name` và/hoặc `users.photo_url`, đặt `profile_customized = true`.
        - Ảnh tải lên: client đã thu nhỏ về 256×256 WebP và upload `avatars/{uid}/{uuid}.webp` (Storage Rules ≤ 5 MB,
          `image/*`); server kiểm `storagePath` thuộc `uid` và file tồn tại, rồi xóa ảnh cũ trong `avatars/{uid}/` (ADR-12).
        - Avatar có sẵn: `presetId` trỏ file `public/avatars/{presetId}.png`.
        Nếu đang ở phòng và đã là player của ván hiện tại (`waiting`): cập nhật `display_name`, `photo_url` của doc
        player đó (database-design §4). Tên trong `messages` cũ giữ nguyên (chép lúc gửi). Client tự ghi lại tên/ảnh
        vào node presence RTDB của mình (ADR-06).
      x-business: [BIZ-16]
      x-screens: [SCR-10.A1, SCR-10.A2]
      x-roles: [ACT-01, ACT-02, ACT-03]
      x-supporting: [SUP-08, SUP-01]
      x-errors: [VALIDATION_FAILED, UNAUTHENTICATED, DISPLAY_NAME_INVALID, AVATAR_INVALID]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
            examples:
              rename:
                summary: Đổi tên
                value:
                  displayName: An lô tô
              upload:
                summary: Ảnh tải lên
                value:
                  avatar:
                    kind: upload
                    storagePath: avatars/u_7Hq2Lx/8b1f0c2e-4d7a-4b9e-9f3a-2c6d1e5f7a90.webp
              preset:
                summary: Avatar có sẵn
                value:
                  avatar:
                    kind: preset
                    presetId: cat-03
      responses:
        '200':
          description: Hồ sơ sau khi cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                uid: u_7Hq2Lx
                email: an.nguyen@gmail.com
                displayName: An lô tô
                photoUrl: https://firebasestorage.googleapis.com/v0/b/loto.appspot.com/o/avatars%2Fu_7Hq2Lx%2F8b1f.webp?alt=media
                googleName: An Nguyễn
                googlePhotoUrl: https://lh3.googleusercontent.com/a/abc
                profileCustomized: true
                currentRoomId: r_9fK2mQ
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'

  /me/profile/reset:
    post:
      tags: [Profile]
      operationId: resetProfile
      summary: Khôi phục tên/ảnh theo Google
      description: |
        `display_name = google_name`, `photo_url = google_photo_url`, `profile_customized = false`; xóa ảnh trong
        `avatars/{uid}/`. Cập nhật doc player của ván hiện tại như `updateProfile`.
      x-business: [BIZ-16]
      x-screens: [SCR-10.A3]
      x-roles: [ACT-01, ACT-02, ACT-03]
      x-supporting: [SUP-08]
      x-errors: [UNAUTHENTICATED]
      responses:
        '200':
          description: Hồ sơ sau khi khôi phục
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example:
                uid: u_7Hq2Lx
                email: an.nguyen@gmail.com
                displayName: An Nguyễn
                photoUrl: https://lh3.googleusercontent.com/a/abc
                googleName: An Nguyễn
                googlePhotoUrl: https://lh3.googleusercontent.com/a/abc
                profileCustomized: false
                currentRoomId: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ───────────────────────────── Rooms ─────────────────────────────
  /rooms:
    post:
      tags: [Rooms]
      operationId: createRoom
      summary: Tạo phòng
      description: |
        Transaction (BR-02: `users.current_room_id` phải rỗng):
        - `rooms/{roomId}`: `name` (mặc định "Phòng của {display_name}"), `host_uid = created_by = uid`, `status = active`,
          `member_count = 1`, `invite_code` 22 ký tự base62 ngẫu nhiên (`crypto`), `expires_at = invite_expires_at =
