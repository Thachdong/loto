          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: m_5tRq1Z
                senderUid: u_7Hq2Lx
                senderName: An Nguyễn
                senderPhotoUrl: https://lh3.googleusercontent.com/a/abc
                text: Chờ 1 số nữa thôi 😆
                createdAt: '2026-11-18T13:18:42Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
