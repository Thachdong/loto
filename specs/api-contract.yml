        `presence/{roomId}/{uid}` (`online = false` hoặc không có node) — server đọc RTDB bằng Admin SDK
        (ADR-06, Q-048). Xóa doc player của họ → vé trống; `last_event = tickets_reclaimed` (`target_uid`).
        Người bị thu hồi vẫn ở phòng (FLOW-04 A1, A2). Dùng trước `renewTicketSet` khi chỉ còn người offline giữ vé.
