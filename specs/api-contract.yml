        (`ROOM_CLOSING`, BR-14). Transaction:
        1. Xóa các player có `ticket_ids` rỗng hoặc không còn trong phòng (`users.current_room_id ≠ roomId`) (Q-047).
        2. Còn < 2 player → `422 NO_TICKETS_HELD` (BR-14, Q-059), không đổi gì (rollback).
        3. Chép `display_name`, `photo_url` hiện tại vào từng player; `games.player_count`, `started_at`.
        4. `games.status = running`, `last_event = game_started`; **server rao ngay số đầu tiên**: `rooms.called_numbers =
           [crypto.randomInt(1..90)]` (Q-046, Q-052), `next_call_at = now + N`.
        Client phát tiếng rao số đầu; từ số thứ hai host (và dự phòng) gọi `drawNumber` khi tới `next_call_at` (ADR-05).
