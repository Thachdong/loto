          description: Kết quả kiểm Kinh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResult'
              examples:
                win:
                  summary: Gợi ý đúng → chờ host duyệt
                  value:
                    result: win
                    ticketId: green_b
                    row: 4
                    gameStatus: awaiting_confirm
                miss:
                  summary: Gợi ý hụt → vẫn chờ host duyệt (host bác bỏ thì quay tiếp)
                  value:
                    result: miss
                    ticketId: green_b
                    row: null
                    gameStatus: awaiting_confirm
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /rooms/{roomId}/games/{gameId}/draw:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/GameId'
    post:
      tags: [Games]
      operationId: drawNumber
      summary: Rao số kế tiếp (client điều nhịp)
      description: |
        Thay task `gameTick` (Q-051, ADR-05). Gọi bởi **host** đúng lúc `next_call_at`. **Dự phòng (Q-052):** các player của
        ván (trừ host) xếp theo **vé nhỏ nhất họ giữ** theo thứ tự vé cố định (Đỏ A, Đỏ B, Cam A, … Hồng B); dự phòng thứ k
        gọi ở `next_call_at + 5k giây` nếu vẫn chưa thấy số mới — lần lượt tới player cuối. Server **tự chọn số**, client
        chỉ báo "đã tới giờ". Transaction:
        1. Lazy expiry phòng (BR-04). Ván phải là ván hiện tại (`GAME_STALE`) và `running`, ngược lại `409 GAME_NOT_RUNNING`.
        2. `seq ≠ len(rooms.called_numbers)` → **200 `drawn: false`** kèm trạng thái hiện tại (lượt gọi trùng/cũ – không lỗi).
        3. `now < next_call_at − 300ms` → `409 DRAW_TOO_EARLY` (kèm `nextCallAt`) — chống gọi sớm để đẩy nhanh ván (NFR-08).
        4. `crypto.randomInt` một số trong 1–90 chưa có trong `called_numbers`, append; `next_call_at = now + draw_interval_sec`
           (nhịp mới áp dụng từ đây – BR-15).
        5. Đã đủ 90 số → ván `finished`, `result = no_winner`, `ended_at`, `last_event = game_finished`; phòng `active` thì
           tạo ván mới `waiting` + chép player còn trong phòng **và đang online** (BR-19, BR-07, BR-11, BR-29 – Q-058);
           phòng `closing` thì đóng phòng.
        Chỉ host và player của ván được gọi (`403 NOT_ROOM_MEMBER` nếu không phải) để ván chạy tiếp khi host offline (Q-048).
      x-business: [BIZ-07]
      x-screens: [SCR-04.A10]
      x-roles: [ACT-02, ACT-03]
      x-supporting: [SUP-03]
      x-nfr: [NFR-01, NFR-08]
      x-errors: [UNAUTHENTICATED, NOT_ROOM_MEMBER, GAME_STALE, GAME_NOT_RUNNING, DRAW_TOO_EARLY]
      x-last-event: [game_finished]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DrawRequest'
            example:
              seq: 22
      responses:
        '200':
          description: Kết quả rao số (`drawn = false` khi lượt gọi trùng)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrawResult'
              example:
                drawn: true
                number: 47
                seq: 23
                nextCallAt: '2026-11-18T13:12:08Z'
                gameStatus: running
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # /rooms/{roomId}/games/{gameId}/claim-window/close — `closeClaimWindow` đã loại (Q-055: bỏ cửa sổ đồng kinh 5 giây).

  /rooms/{roomId}/expire:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Rooms]
      operationId: expireRoom
      summary: Áp dụng hết hạn phòng (client gọi khi đếm ngược về 0)
      description: |
        Thay task `roomClose` (Q-051). Thành viên gọi khi `now ≥ rooms.expires_at` (client đếm ngược; mở app thấy phòng
        đã quá hạn cũng gọi). Idempotent; cùng logic với **lazy expiry** chạy đầu mọi thao tác trên phòng:
        - `now < expires_at` → `409 ROOM_NOT_EXPIRED`.
        - Ván `waiting` → `cancelled` (`result = cancelled`), phòng `closed` ngay.
        - Ván `running`/`paused` → phòng `closing`, `last_event = room_closing`; đóng khi ván kết thúc.
        - Ván `awaiting_confirm` → ván tự `finished`: `winners` = `claims` có `result = win` (`result = won`), không có
          thì `result = no_winner`; rồi đóng phòng (BR-04, Q-042, Q-055).
        - Đóng phòng: `status = closed`, `closed_at`, `close_reason = expired`, `member_count = 0`,
          `users.current_room_id = null` cho mọi người có `current_room_id == roomId`, xóa RTDB `presence/{roomId}`,
          `presence_access/{roomId}` (Q-039).
        Cảnh báo "còn 15 phút" do client tự hiện từ `expires_at`, không cần API.
      x-business: [BIZ-14]
      x-screens: [SCR-04.A11]
      x-roles: [ACT-02, ACT-03]
      x-supporting: [SUP-01, SUP-03]
      x-errors: [UNAUTHENTICATED, NOT_ROOM_MEMBER, ROOM_NOT_EXPIRED]
      x-last-event: [room_closing]
      responses:
        '200':
          description: Trạng thái phòng sau khi áp dụng hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomExpireResult'
              example:
                roomStatus: closing
                gameStatus: running
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /rooms/{roomId}/games/{gameId}/claims/reject:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/GameId'
    post:
      tags: [Games]
      operationId: rejectClaims
      summary: Bác bỏ các lượt Kinh đang chờ duyệt (host)
      description: |
        (Q-055) Chỉ host; ván `awaiting_confirm`. Transaction:
        - Có phần tử `claims[].result = win` → `409 CLAIM_HAS_WIN` (host không làm trái gợi ý – BR-28; phải dùng `confirmGame`).
        - Ngược lại: `claims = []`, `status = resume_status` (`running` → `next_call_at = now + draw_interval_sec`;
          `paused` → giữ `pause_reason = host`), `resume_status = null`, `last_event = claims_rejected`
          (text liệt kê "<tên> kinh hụt"). Client phát tiếng kinh hụt (SUP-02). Không lưu lượt hụt (Q-031).
      x-business: [BIZ-08]
      x-screens: [SCR-09.A3]
      x-roles: [ACT-02]
      x-supporting: [SUP-01, SUP-02]
      x-nfr: [NFR-09]
      x-errors: [UNAUTHENTICATED, NOT_ROOM_MEMBER, NOT_ROOM_HOST, GAME_STALE, GAME_NOT_AWAITING_CONFIRM, CLAIM_HAS_WIN]
      x-last-event: [claims_rejected]
      responses:
        '200':
          description: Trạng thái ván sau khi bác bỏ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
              example:
                gameId: g_01
                seqNo: 1
                status: running
                playerCount: 6
                startedAt: '2026-11-18T13:05:00Z'
                nextCallAt: '2026-11-18T13:20:10Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /rooms/{roomId}/games/{gameId}/confirm:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/GameId'
    post:
      tags: [Games]
      operationId: confirmGame
      summary: Xác nhận kết thúc ván (host)
      description: |
        Chỉ host; ván `awaiting_confirm` và có ≥ 1 `claims[].result = win`, ngược lại `409 NO_WINNING_CLAIM` (BR-28 —
        host không làm trái gợi ý; toàn hụt thì dùng `rejectClaims`; host tự kinh vẫn tự xác nhận – Q-055). Transaction:
        - Ván: `winners` = `claims` có `result = win`; `status = finished`, `result = won`, `ended_at`, `confirmed_by = uid`,
          `last_event = game_finished`.
        - Phòng `active`: tạo ván mới `waiting` (`seq_no = game_count + 1`), `rooms.current_game_id`, `game_count + 1`;
          chép sang ván mới các player **còn trong phòng và đang online** (đọc RTDB `presence/{roomId}`) cùng `ticket_ids`
          (BR-07, BR-11). Người offline / đã rời không được chép → vé trống (BR-29, BR-22 – Q-058). `called_numbers` giữ tới khi
          ván mới Bắt đầu (Q-046).
        - Phòng `closing` (đã quá hạn): không tạo ván mới, đóng phòng như `expireRoom` (BR-04) → `nextGameId = null`.
      x-business: [BIZ-08, BIZ-13]
      x-screens: [SCR-09.A1]
      x-roles: [ACT-02]
      x-supporting: [SUP-01, SUP-02, SUP-09]
      x-nfr: [NFR-09]
      x-errors: [UNAUTHENTICATED, NOT_ROOM_MEMBER, NOT_ROOM_HOST, GAME_STALE, GAME_NOT_AWAITING_CONFIRM, NO_WINNING_CLAIM]
      x-last-event: [game_finished]
      responses:
        '200':
          description: Ván đã kết thúc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameConfirmResult'
              example:
                finishedGameId: g_01
                result: won
                winners:
                  - uid: u_2Mn8Rt
                    displayName: Bình Trần
                    ticketId: green_b
                    color: green
                    row: 4
                    claimedAt: '2026-11-18T13:20:00Z'
                nextGameId: g_02
                roomStatus: active
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  # ───────────────────────────── Messages ─────────────────────────────
  /rooms/{roomId}/messages:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: Gửi tin nhắn chat
      description: |
        Người gửi còn trong phòng. `text` được trim, 1–500 ký tự (BR-23). Chống spam (SUP-07): trong transaction đọc
        `users.chat_recent_at`, nếu đã có 5 mốc trong 10 giây gần nhất → `429 RATE_LIMITED` (giữ nội dung ở ô nhập –
        FLOW-12 E2); ngược lại thêm mốc now, giữ tối đa 5.
        Tạo `messages/{id}` với `sender_uid`, `sender_name`, `sender_photo_url` (chép lúc gửi), `text`, `created_at`.
        Không sửa/xóa (BR-23). Không ghi `last_event` (cả phòng thấy qua listener `messages`).
      x-business: [BIZ-12]
      x-screens: [SCR-06.A1]
      x-roles: [ACT-03, ACT-02]
      x-supporting: [SUP-07, SUP-01]
      x-nfr: [NFR-02]
      x-errors: [VALIDATION_FAILED, UNAUTHENTICATED, NOT_ROOM_MEMBER, MESSAGE_EMPTY, MESSAGE_TOO_LONG, RATE_LIMITED]
      requestBody:
