  /rooms/join:
    post:
      tags: [Invites]
      operationId: joinRoom
      summary: Vào phòng bằng mã mời (link) hoặc mã phòng (gõ tay)
      description: |
        Body có đúng 1 trong 2 (Q-056): `inviteCode` (từ link `/join/{code}`, SCR-03) hoặc `roomCode` (mã 6 ký tự nhập ở
        Home, SCR-02 – chuẩn hóa in hoa, bỏ khoảng trắng). Transaction (Q-047, database-design §4):
        query `rooms where invite_code == inviteCode` hoặc `rooms where join_code == roomCode and status == active` →
        1. Không có → `404 INVITE_INVALID` (link) / `404 ROOM_CODE_INVALID` (mã phòng; cũng dùng khi phòng hết hạn/đóng –
           không phân biệt để khó dò mã).
        2. Đã ở chính phòng này → `200 alreadyMember = true`, không đổi gì (FLOW-03 A1).
        3. `status ≠ active` hoặc quá `invite_expires_at` → `410 INVITE_EXPIRED` (BR-05, BR-04).
        4. `uid ∈ blocked_uids` → `403 BLOCKED_FROM_ROOM` (BR-06).
        5. `users.current_room_id` là phòng khác → `409 ALREADY_IN_ROOM` (BR-02).
        6. `member_count ≥ 16` → `409 ROOM_FULL` (BR-03).
        Hợp lệ: `users.current_room_id = roomId`, `rooms.member_count + 1`, `last_event = member_joined`,
        RTDB `presence_access/{roomId}/{uid} = true`. **Không** tạo player; người từng tự rời vào lại như mới, không
        được trả vé cũ (BR-25). Vào khi ván đang chạy: chỉ xem, lấy vé ở ván sau (FLOW-03 A3, BR-10).
