      x-screens: [SCR-04.A8]
      x-roles: [ACT-03, ACT-02]
      x-supporting: [SUP-01]
      x-errors: [UNAUTHENTICATED, NOT_ROOM_MEMBER]
      x-last-event: [member_left, room_closed]
      responses:
        '204':
          description: Đã rời phòng; client điều hướng về SCR-02
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
