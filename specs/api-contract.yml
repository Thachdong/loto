      x-screens: [SCR-07.A1]
      x-roles: [ACT-02]
      x-supporting: [SUP-01]
      x-nfr: [NFR-09]
      x-errors: [UNAUTHENTICATED, NOT_ROOM_MEMBER, NOT_ROOM_HOST, CANNOT_TARGET_SELF, PLAYER_NOT_FOUND]
