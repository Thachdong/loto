      x-screens: [SCR-03.A1, SCR-02.A4]
      x-roles: [ACT-01, ACT-04]
      x-supporting: [SUP-01, SUP-05, SUP-09]
      x-nfr: [NFR-04, NFR-09]
      x-errors: [VALIDATION_FAILED, UNAUTHENTICATED, INVITE_INVALID, ROOM_CODE_INVALID, INVITE_EXPIRED, BLOCKED_FROM_ROOM, ALREADY_IN_ROOM, ROOM_FULL]
