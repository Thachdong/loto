        cần đăng nhập** để crawler Zalo/Messenger/Telegram đọc được. Hiện thực là hàm server dùng chung cho
        `page.tsx` và `generateMetadata`, không phải Server Action; có thể expose Route Handler GET nếu cần.
        Chỉ trả tên phòng, tên/ảnh host, số người, hạn — không dữ liệu cá nhân khác (NFR-10).
        `status`: `valid` · `expired` (quá `invite_expires_at` hoặc phòng `closing`) · `closed` · `full` (16 người).
        Nếu có cookie hợp lệ, trả thêm `viewer` để SCR-03 chọn nút (Vào phòng / Về phòng hiện tại / bị chặn / tự chuyển
