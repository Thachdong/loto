  /rooms/{roomId}/games/{gameId}/claims:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/GameId'
    post:
      tags: [Games]
      operationId: createClaim
      summary: Báo Kinh cho một vé
      description: |
        Transaction (database-design §4, Q-046):
        - Người báo còn trong phòng (`NOT_ROOM_MEMBER`); ván hiện tại (`GAME_STALE`) ở `running`, `paused` hoặc
          `awaiting_confirm` — khác → `409 CLAIMS_CLOSED` (Q-055: chờ host duyệt **vẫn nhận** Kinh; Q-029: tạm dừng vẫn nhận).
        - `ticketId ∈ players/{uid}.ticket_ids` của ván (`403 NOT_TICKET_HOLDER`, FLOW-08 E1, BR-22).
        - Vé đã có trong `claims` → `409 TICKET_ALREADY_CLAIMED`.
        - So `tickets/{ticketId}.grid` với `rooms.called_numbers` **lúc bấm**: có hàng mà 5 số đều đã rao → gợi ý `win`,
          ngược lại `miss` (BR-17).
        Kết quả (Q-055 — mọi lượt đều chờ host duyệt, không còn cửa sổ đồng kinh):
        - Append `claims` `{uid, display_name, ticket_id, color, result, row, claimed_at}`.
        - Ván `running`/`paused` → `resume_status = status`, `status = awaiting_confirm`, `next_call_at = null`
          (dừng quay – BR-16). Ván đã `awaiting_confirm` → chỉ append.
        - `last_event = claim_submitted` ("<tên> KINH!"). Cả phòng thấy danh sách `claims` kèm gợi ý qua listener `games`;
          host duyệt bằng `confirmGame` / `rejectClaims` (BR-28).
        `row` = chỉ số hàng đủ số nhỏ nhất nếu nhiều hàng cùng đủ. (Q-050)
        Thời gian xử lý ≤ 1 giây P95 (NFR-03). Thông tin vé thắng/hàng thắng cả phòng thấy qua listener `games`.
      x-business: [BIZ-08]
      x-screens: [SCR-04.A3]
      x-roles: [ACT-03, ACT-02]
      x-supporting: [SUP-01, SUP-02, SUP-03]
      x-nfr: [NFR-03, NFR-08]
      x-errors: [VALIDATION_FAILED, UNAUTHENTICATED, NOT_ROOM_MEMBER, NOT_TICKET_HOLDER, GAME_STALE, CLAIMS_CLOSED, TICKET_ALREADY_CLAIMED]
      x-last-event: [claim_submitted]
