        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /rooms/{roomId}/players/{uid}/kick:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/TargetUid'
    post:
      tags: [Members]
      operationId: kickPlayer
      summary: Kick player (host)
      description: |
        Chỉ host (BR-21). Đích phải là **player của ván hiện tại** (có doc `players/{uid}`), còn trong phòng
        (`users.current_room_id == roomId`) và không phải host (Q-048, BIZ-10 E1). Transaction:
        - `rooms.blocked_uids` thêm `uid` (BR-06), `member_count − 1`, `last_event = member_kicked` (`target_uid`).
        - `users/{uid}.current_room_id = null` → người đó mất quyền đọc phòng và về SCR-02.
        - Ván `waiting`: xóa doc player → vé trống ngay. Ván đang diễn ra: giữ doc player, người bị kick không Kinh
          được, vé trống ở ván sau (BR-22).
        - Xóa RTDB `presence/{roomId}/{uid}`, `presence_access/{roomId}/{uid}`.
        (Q-050) Người bị kick không đọc được `rooms.last_event` nữa nên client của họ chỉ thấy `current_room_id`
        chuyển null mà không do mình rời → hiện thông báo chung "Bạn không còn ở phòng" (DB không có field lý do).
