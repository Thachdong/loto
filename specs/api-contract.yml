components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __session
      description: |
        Firebase session cookie (14 ngày) tạo bởi `createSession`; server `verifySessionCookie(cookie, checkRevoked = true)`
        (ADR-07, SUP-05).

  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      description: id phòng (`rooms/{roomId}`)
      schema:
        $ref: '#/components/schemas/RoomId'
    GameId:
      name: gameId
      in: path
      required: true
      description: id ván; phải bằng `rooms.current_game_id`, nếu không → `409 GAME_STALE`
      schema:
        $ref: '#/components/schemas/GameId'
    TicketId:
      name: ticketId
      in: path
      required: true
      description: id vé `{color}_{side}` (TBL-03)
      schema:
        $ref: '#/components/schemas/TicketId'
    TargetUid:
      name: uid
      in: path
      required: true
      description: uid người đích (player của ván hiện tại)
      schema:
        $ref: '#/components/schemas/Uid'
    InviteCode:
      name: inviteCode
      in: path
      required: true
      description: mã mời `rooms.invite_code` (ADR-09)
      schema:
        $ref: '#/components/schemas/InviteCode'

  responses:
    BadRequest:
      description: '`VALIDATION_FAILED` — request sai cấu trúc / kiểu'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_FAILED
            message: Dữ liệu gửi lên không hợp lệ
            details:
              - field: ticketId
                code: invalid_string
                message: Mã vé không đúng định dạng
    Unauthorized:
      description: '`UNAUTHENTICATED` · `GOOGLE_TOKEN_INVALID`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHENTICATED
            message: Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại
    Forbidden:
      description: '`NOT_ROOM_MEMBER` · `NOT_ROOM_HOST` · `BLOCKED_FROM_ROOM` · `NOT_TICKET_HOLDER`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notHost:
              summary: NFR-09, BR-21
              value:
                code: NOT_ROOM_HOST
                message: Chỉ host được thực hiện thao tác này
            blocked:
              summary: BR-06
              value:
                code: BLOCKED_FROM_ROOM
                message: Bạn không thể vào phòng này
            notHolder:
              summary: BIZ-08 E1
              value:
                code: NOT_TICKET_HOLDER
                message: Vé này không phải của bạn trong ván này
    NotFound:
      description: '`INVITE_INVALID` · `TICKET_NOT_FOUND` · `PLAYER_NOT_FOUND`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVITE_INVALID
            message: Link mời không tồn tại
    Conflict:
      description: Xung đột trạng thái nghiệp vụ (xem bảng mã lỗi, HTTP 409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            alreadyInRoom:
              summary: BR-02
              value:
                code: ALREADY_IN_ROOM
                message: Bạn đang ở một phòng khác, hãy rời phòng đó trước
                details:
                  - code: current_room
                    currentRoomId: r_3Lp8Vw
            roomFull:
              summary: BR-03
              value:
                code: ROOM_FULL
                message: Phòng đã đầy
            ticketTaken:
              summary: BR-09
              value:
                code: TICKET_TAKEN
                message: Vé đã có người giữ
            stillHeld:
              summary: BR-12
              value:
                code: TICKETS_STILL_HELD
                message: Còn người đang giữ vé
                details:
                  - code: holder
                    uid: u_2Mn8Rt
                    displayName: Bình Trần
                    ticketIds: [red_a]
                    online: true
                  - code: holder
                    uid: u_8Qw3Ez
                    displayName: Cúc Lê
                    ticketIds: [blue_b, pink_a]
                    online: false
            claimsClosed:
              summary: BR-28
              value:
                code: CLAIMS_CLOSED
                message: Ván đã kết thúc, không nhận thêm Kinh
            claimHasWin:
              summary: BR-28 (Q-055)
              value:
                code: CLAIM_HAS_WIN
                message: Có vé kinh đúng — hãy xác nhận kết thúc ván
    Gone:
      description: '`INVITE_EXPIRED` — link không còn hiệu lực'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVITE_EXPIRED
            message: Link không còn hiệu lực
    UnprocessableEntity:
      description: Vi phạm quy tắc nghiệp vụ về dữ liệu (HTTP 422)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            ticketLimit:
              summary: BR-09
              value:
                code: TICKET_LIMIT_REACHED
                message: Mỗi người giữ tối đa 2 vé
            noTickets:
              summary: BR-14
              value:
                code: NO_TICKETS_HELD
                message: Cần ít nhất 2 người lấy vé để bắt đầu
            displayName:
              summary: BR-27
              value:
                code: DISPLAY_NAME_INVALID
                message: Tên hiển thị phải từ 2 đến 30 ký tự
                details:
                  - field: displayName
                    code: too_short
            messageTooLong:
              summary: BR-23
              value:
                code: MESSAGE_TOO_LONG
                message: Tin nhắn tối đa 500 ký tự
    TooManyRequests:
      description: '`RATE_LIMITED` — vượt 5 tin / 10 giây (SUP-07)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMITED
            message: Bạn gửi quá nhanh, chờ một chút nhé
            details:
              - code: retry_after
                retryAfter: '2026-11-18T13:18:50Z'
    InternalError:
      description: '`INTERNAL_ERROR`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Có lỗi xảy ra, vui lòng thử lại

  schemas:
    # ── Kiểu cơ bản ──
    Uid:
      type: string
      minLength: 1
      maxLength: 128
      description: uid Firebase Auth
    RoomId:
      type: string
      minLength: 1
      maxLength: 64
    GameId:
      type: string
      minLength: 1
      maxLength: 64
    TicketColor:
      type: string
      enum: [red, orange, yellow, green, teal, blue, purple, pink]
      description: 8 màu vé (BR-08)
    TicketId:
      type: string
      pattern: '^(red|orange|yellow|green|teal|blue|purple|pink)_(a|b)$'
      description: '`{color}_{side}`; hai vé cùng màu gộp đủ 1–90 (BR-08)'
    InviteCode:
      type: string
      pattern: '^[0-9A-Za-z]{22}$'
      description: 22 ký tự base62 ngẫu nhiên (~128 bit), không đoán được (NFR-09, ADR-09)
    RoomCode:
      type: string
      pattern: '^[A-HJ-NP-Z2-9]{6}$'
      description: Mã phòng 6 ký tự, chữ in hoa + số, bỏ O/0/I/1; client chuẩn hóa in hoa trước khi gửi (BR-30, Q-056)
    RoomStatus:
      type: string
      enum: [active, closing, closed]
      description: Vòng đời ENT-02 (TBL-02)
    GameStatus:
      type: string
      enum: [waiting, running, paused, awaiting_confirm, finished, cancelled]
      description: Vòng đời ENT-05 (TBL-05). `awaiting_confirm` = Chờ host duyệt (Q-055); bỏ `claim_window`.
    GameResult:
      type: string
      enum: [won, no_winner, cancelled]

    # ── Lỗi ──
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Mã lỗi nghiệp vụ (xem bảng trong `info.description`)
          examples: [TICKET_TAKEN]
        message:
          type: string
          description: Thông báo tiếng Việt hiển thị được cho người dùng
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [code]
      properties:
        field:
          type: string
          description: Trường lỗi (với lỗi validation)
        code:
          type: string
        message:
          type: string
      additionalProperties: true

    # ── Auth / Profile ──
    SessionCreate:
      type: object
      required: [idToken]
      additionalProperties: false
      properties:
        idToken:
          type: string
          minLength: 1
          description: Firebase ID token sau khi đăng nhập Google (BR-01)
    SessionResult:
      type: object
      required: [me, isNewUser]
      properties:
        me:
          $ref: '#/components/schemas/Me'
        isNewUser:
          type: boolean
          description: Lần đầu đăng nhập (vừa tạo `users/{uid}`)
    Me:
      type: object
      description: Hồ sơ của chính mình (TBL-01). Không gồm `chat_recent_at`, `last_active_at`.
      required: [uid, email, displayName, photoUrl, googleName, googlePhotoUrl, profileCustomized, currentRoomId]
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        email:
          type: string
          format: email
          description: Chỉ trả cho chính chủ (NFR-10)
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        photoUrl:
          type: [string, 'null']
          format: uri
        googleName:
          type: string
        googlePhotoUrl:
          type: [string, 'null']
          format: uri
        profileCustomized:
          type: boolean
        currentRoomId:
          type: [string, 'null']
          description: Phòng đang ở (BR-02); null nếu không ở phòng nào
    ProfileUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 30
          description: Tên hiển thị, đã trim (BR-27)
        avatar:
          $ref: '#/components/schemas/AvatarInput'
    AvatarInput:
      description: Ảnh đại diện mới (BR-27, ADR-12)
      oneOf:
        - type: object
          title: AvatarUpload
          required: [kind, storagePath]
          additionalProperties: false
          properties:
            kind:
              const: upload
            storagePath:
              type: string
              pattern: '^avatars/[^/]+/[0-9a-fA-F-]{36}\.webp$'
              description: Đường dẫn Storage đã upload; phần `{uid}` phải là uid người gọi
        - type: object
          title: AvatarPreset
          required: [kind, presetId]
          additionalProperties: false
          properties:
            kind:
              const: preset
            presetId:
              type: string
              pattern: '^[a-z0-9-]{1,32}$'
              description: Tên file trong `public/avatars/` (không đuôi)
      discriminator:
        propertyName: kind

    # ── Rooms / Invites ──
    RoomCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: Tên phòng, đã trim; bỏ trống → "Phòng của {display_name}"
    RoomCreated:
      type: object
      required: [roomId, name, inviteCode, inviteUrl, roomCode, currentGameId, drawIntervalSec, expiresAt]
      properties:
        roomId:
          $ref: '#/components/schemas/RoomId'
        name:
          type: string
        inviteCode:
          $ref: '#/components/schemas/InviteCode'
        roomCode:
          $ref: '#/components/schemas/RoomCode'
        inviteUrl:
          type: string
          format: uri
          description: '`https://{host}/join/{inviteCode}` (SUP-06)'
        currentGameId:
          $ref: '#/components/schemas/GameId'
        drawIntervalSec:
          type: integer
          enum: [5, 10, 15]
        expiresAt:
          type: string
          format: date-time
          description: created_at + 8 giờ (BR-04, BR-05)
    RoomUpdate:
      type: object
      required: [drawIntervalSec]
      additionalProperties: false
      properties:
        drawIntervalSec:
          type: integer
          enum: [5, 10, 15]
          description: Nhịp quay (giây/số) (BR-15)
    RoomSettings:
      type: object
      required: [roomId, drawIntervalSec]
      properties:
        roomId:
          $ref: '#/components/schemas/RoomId'
        drawIntervalSec:
          type: integer
          enum: [5, 10, 15]
    InvitePreview:
      type: object
      required: [status, room, viewer]
      properties:
        status:
          type: string
          enum: [valid, expired, closed, full]
          description: |
            `valid` vào được · `expired` link quá hạn / phòng chờ đóng · `closed` phòng đã đóng · `full` đủ 16 người
        room:
          type: object
          required: [name, hostName, hostPhotoUrl, memberCount, maxMembers, expiresAt]
          properties:
            name:
              type: string
            hostName:
              type: string
            hostPhotoUrl:
              type: [string, 'null']
              format: uri
            memberCount:
              type: integer
              minimum: 0
              maximum: 16
            maxMembers:
              type: integer
              const: 16
            expiresAt:
              type: string
              format: date-time
        viewer:
          description: Chỉ có khi có session cookie hợp lệ; null nếu chưa đăng nhập
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/InviteViewer'
    InviteViewer:
      type: object
      required: [inThisRoom, currentRoomId, blocked]
      properties:
        inThisRoom:
          type: boolean
          description: Đã ở chính phòng này → client tự chuyển SCR-04
        currentRoomId:
          type: [string, 'null']
          description: Phòng đang ở (nếu ở phòng khác → nút "Về phòng hiện tại", BR-02)
        blocked:
          type: boolean
          description: Đã bị kick khỏi phòng này (BR-06)
    JoinRoomRequest:
      description: Đúng 1 trong `inviteCode` (link) hoặc `roomCode` (mã phòng gõ tay – Q-056)
      oneOf:
        - type: object
          required: [inviteCode]
          additionalProperties: false
          properties:
            inviteCode:
              $ref: '#/components/schemas/InviteCode'
        - type: object
          required: [roomCode]
          additionalProperties: false
          properties:
            roomCode:
              $ref: '#/components/schemas/RoomCode'
    JoinRoomResult:
      type: object
      required: [roomId, alreadyMember]
      properties:
        roomId:
          $ref: '#/components/schemas/RoomId'
        alreadyMember:
          type: boolean

    # ── Members ──
    KickResult:
      type: object
      required: [uid, ticketsFreedNow, gameStatus]
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        ticketsFreedNow:
          type: boolean
          description: true nếu ván `waiting` (vé trống ngay); false nếu ván đang diễn ra (vé trống ở ván sau – BR-22)
        gameStatus:
          $ref: '#/components/schemas/GameStatus'
    ReclaimResult:
      type: object
      required: [uid, releasedTicketIds]
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        releasedTicketIds:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/TicketId'

    # ── Tickets ──
    MyTickets:
      type: object
      required: [gameId, ticketIds]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        ticketIds:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/TicketId'
          description: Vé mình đang giữ ở ván hiện tại (BR-09)
    TicketSetRenewed:
      type: object
      required: [ticketSetNo]
      properties:
        ticketSetNo:
          type: integer
          minimum: 2

    # ── Games ──
    DrawRequest:
      type: object
      required: [seq]
      additionalProperties: false
      properties:
        seq:
          type: integer
          minimum: 0
          maximum: 89
          description: Số lượng số đã rao mà client đang thấy (`len(rooms.called_numbers)`); dùng để khử trùng
    DrawResult:
      type: object
      required: [drawn, number, seq, nextCallAt, gameStatus]
      properties:
        drawn:
          type: boolean
          description: false khi lượt gọi trùng/cũ (đã có người rao số này)
        number:
          type: [integer, 'null']
          minimum: 1
          maximum: 90
        seq:
          type: integer
          minimum: 0
          maximum: 90
        nextCallAt:
          type: [string, 'null']
          format: date-time
        gameStatus:
          $ref: '#/components/schemas/GameStatus'
    RoomExpireResult:
      type: object
      required: [roomStatus, gameStatus]
      properties:
        roomStatus:
          type: string
          enum: [active, closing, closed]
        gameStatus:
          $ref: '#/components/schemas/GameStatus'
    GameState:
      type: object
      required: [gameId, seqNo, status, playerCount, startedAt, nextCallAt]
      properties:
        gameId:
          $ref: '#/components/schemas/GameId'
        seqNo:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/GameStatus'
        playerCount:
          type: integer
          minimum: 0
          maximum: 16
        startedAt:
          type: [string, 'null']
          format: date-time
        nextCallAt:
          type: [string, 'null']
          format: date-time
          description: Thời điểm dự kiến rao số kế tiếp (client hiện đếm ngược)
    ClaimCreate:
      type: object
      required: [ticketId]
      additionalProperties: false
      properties:
        ticketId:
          $ref: '#/components/schemas/TicketId'
    ClaimResult:
      type: object
      required: [result, ticketId, row, gameStatus]
      properties:
        result:
          type: string
          enum: [win, miss]
          description: Gợi ý của hệ thống — Kinh đúng / Kinh hụt (BR-17); host chốt (BR-28, Q-055)
        ticketId:
          $ref: '#/components/schemas/TicketId'
        row:
          type: [integer, 'null']
          minimum: 0
          maximum: 8
          description: Hàng thắng (0–8, từ trên xuống); null khi hụt
        gameStatus:
          $ref: '#/components/schemas/GameStatus'
    Winner:
      type: object
      description: Phần tử `games.winners` (TBL-05, Q-046)
      required: [uid, displayName, ticketId, color, row, claimedAt]
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        displayName:
          type: string
        ticketId:
          $ref: '#/components/schemas/TicketId'
        color:
          $ref: '#/components/schemas/TicketColor'
        row:
          type: integer
          minimum: 0
          maximum: 8
        claimedAt:
          type: string
          format: date-time
    GameConfirmResult:
      type: object
      required: [finishedGameId, result, winners, nextGameId, roomStatus]
      properties:
        finishedGameId:
          $ref: '#/components/schemas/GameId'
        result:
          $ref: '#/components/schemas/GameResult'
        winners:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Winner'
        nextGameId:
          type: [string, 'null']
          description: Ván mới `waiting`; null nếu phòng đang chờ đóng nên đã đóng luôn (BR-04)
        roomStatus:
          $ref: '#/components/schemas/RoomStatus'

    # ── Messages ──
    MessageCreate:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Text/emoji, trim trước khi kiểm độ dài (BR-23)
    Message:
      type: object
      required: [id, senderUid, senderName, senderPhotoUrl, text, createdAt]
      properties:
        id:
          type: string
        senderUid:
          $ref: '#/components/schemas/Uid'
        senderName:
          type: string
        senderPhotoUrl:
          type: [string, 'null']
          format: uri
        text:
          type: string
          minLength: 1
          maxLength: 500
        createdAt:
          type: string
          format: date-time
