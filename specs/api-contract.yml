                  value:
                    roomId: r_9fK2mQ
                    alreadyMember: false
                already:
                  summary: Đã là thành viên
                  value:
                    roomId: r_9fK2mQ
                    alreadyMember: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/InternalError'

  # ───────────────────────────── Members ─────────────────────────────
  /rooms/{roomId}/leave:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [Members]
      operationId: leaveRoom
      summary: Rời phòng (player rời; host rời = đóng phòng)
      description: |
        (Q-057) Không chặn khi ván đang diễn ra; client hiện dialog cảnh báo trước. Transaction:
        - **Player:** `users.current_room_id = null`, `rooms.member_count − 1`, `last_event = member_left`.
          Ván `waiting` → xóa doc player → vé trống ngay. Ván `running`/`paused`/`awaiting_confirm` → giữ doc player
          (vé **bị hủy**: người out không Kinh được – `createClaim` từ chối; ván mới không chép → vé trống) (BR-22).
          Lượt Kinh của họ đã nằm trong `claims` vẫn giữ (FLOW-08 E3).
        - **Host:** đóng phòng ngay (BR-21): ván hiện tại chưa kết thúc → `cancelled` (`result = cancelled`, `ended_at`),
          phòng `closed`, `close_reason = host_left`, `last_event = room_closed`, `users.current_room_id = null` cho mọi
          người trong phòng, xóa RTDB presence của phòng.
        - Xóa RTDB `presence/{roomId}/{uid}` và `presence_access/{roomId}/{uid}`.
